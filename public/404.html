<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>יומן משפחתי</title>
  <script>
    // GitHub Pages SPA redirect trick:
    // Store the path in sessionStorage and redirect to index.html
    const path = window.location.pathname;
    const base = '/FamilyPlanner';
    const route = path.replace(base, '') || '/';
    sessionStorage.setItem('spa_redirect', route);
    window.location.replace(base + '/');
  </script>
</head>
<body></body>
</html>
